name: Changenote Inspect
description: Return the latest verified batch and its GitHub publication state, including completed batches (Linux).
inputs:
  cli-path:
    description: Trusted absolute CLI path returned by changenote/action/setup in this job. Empty installs version.
    default: ''
  version:
    description: Changenote CLI version to install from PyPI with uv. Use latest or an exact stable version with a v prefix.
    default: latest
  github-token:
    description: Token with contents read permission.
    default: ${{ github.token }}
  base-branch:
    description: Base branch. Defaults to the repository default branch.
    default: ''
outputs:
  release-commit:
    description: Validated release commit, or an empty string.
    value: ${{ steps.inspect.outputs.release-commit }}
  releases:
    description: JSON array of package, version, and tag objects from the verified release plan.
    value: ${{ steps.inspect.outputs.releases }}
  ready:
    description: Whether complete inspection found no conflicts. False on errors.
    value: ${{ steps.inspect.outputs.ready }}
  publication-needed:
    description: Whether inspection found incomplete GitHub publication work.
    value: ${{ steps.inspect.outputs.publication-needed }}
  publication-plan:
    description: JSON array of name, version, tag, action, and conflicts objects. Empty when no batch exists.
    value: ${{ steps.inspect.outputs.publication-plan }}
runs:
  using: composite
  steps:
    - name: Set up uv
      if: inputs.cli-path == ''
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - name: Install changenote CLI
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CLI_PATH: ${{ inputs.cli-path }}
      run: bash "$ACTION_PATH/../scripts/action/install-cli.sh"
    - id: inspect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/../scripts/action/inspect.sh"
