name: Changenote Setup
description: Install a trusted changenote CLI wheel and return its path for reuse in this job (Linux).
inputs:
  version:
    description: PyPI CLI version, latest or an exact stable version with a v prefix.
    default: latest
  uv-version:
    description: uv version. Empty uses setup-uv's default.
    default: ''
outputs:
  cli-path:
    description: Absolute trusted CLI path. Valid only in this job.
    value: ${{ steps.install.outputs.cli-path }}
  version:
    description: Installed exact CLI version with a v prefix.
    value: ${{ steps.install.outputs.version }}
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
        version: ${{ inputs.uv-version }}
    - name: Install changenote CLI
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_VERSION: ${{ inputs.version }}
      run: bash "$ACTION_PATH/../scripts/action/install-cli.sh"
