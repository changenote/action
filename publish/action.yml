name: Changenote Publish
description: Publish annotated tags and GitHub Releases from the latest validated batch (Linux).
inputs:
  version:
    description: Changenote CLI version to install from PyPI with uv. Use latest or an exact stable version with a v prefix.
    default: latest
  github-token:
    description: Token with contents write permission.
    default: ${{ github.token }}
  base-branch:
    description: Base branch. Defaults to the repository default branch.
    default: ''
  expected-release-commit:
    description: Expected lowercase 40-hex release commit. Empty selects the latest batch without a commit guard.
    default: ''
outputs:
  release-commit:
    description: Validated release commit, or an empty string.
    value: ${{ steps.publish.outputs.release-commit }}
  releases:
    description: JSON array of package, version, and tag objects from the verified saved batch.
    value: ${{ steps.publish.outputs.releases }}
  published:
    description: Whether this run created a remote tag or GitHub Release.
    value: ${{ steps.publish.outputs.published }}
  published-packages:
    description: JSON array of name and version objects changed by this run.
    value: ${{ steps.publish.outputs.published-packages }}
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - name: Install changenote CLI
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_VERSION: ${{ inputs.version }}
      run: bash "$ACTION_PATH/../scripts/action/install-cli.sh"
    - id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        INPUT_EXPECTED_RELEASE_COMMIT: ${{ inputs.expected-release-commit }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/../scripts/action/publish.sh"
